<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Explorer</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #eef2f5;
            color: #13202d;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 13px;
        }

        body {
            padding: 12px;
        }

        .row {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 6px;
            border: 1px solid #9aa8b3;
            background: #ffffff;
            box-sizing: border-box;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
        }

        textarea {
            resize: vertical;
        }

        .checks {
            padding: 8px;
            background: #dfe7ed;
            border: 1px solid #c0ccd6;
        }

        .checks label {
            display: inline-block;
            width: auto;
            margin-right: 14px;
            font-weight: normal;
        }

        .buttons {
            margin-bottom: 10px;
        }

        .buttons button {
            margin-right: 6px;
            padding: 7px 12px;
            border: 1px solid #3d6f99;
            background: #4f87b7;
            color: #ffffff;
            cursor: pointer;
            font-size: 12px;
        }

        .buttons button.secondary {
            background: #6c7d8a;
            border-color: #55636d;
        }

        #status {
            margin-bottom: 10px;
            padding: 6px 8px;
            background: #fff7d8;
            border: 1px solid #dccd83;
        }

        #status.busy {
            background: #dfeeff;
            border-color: #9ab8d3;
        }

        #transcript {
            height: 280px;
            overflow: auto;
            padding: 8px;
            background: #ffffff;
            border: 1px solid #c0ccd6;
        }

        .entry {
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccd8e1;
        }

        .entry h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
        }

        .entry pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .entry .meta {
            margin-top: 6px;
            color: #4a5b68;
            font-size: 11px;
        }

        .prompt-entry {
            background: #f4f9ff;
        }

        .response-entry {
            background: #f5fff2;
        }

        .error-entry {
            background: #fff2f2;
            border-color: #d8abab;
        }

        .footer-links a {
            margin-right: 10px;
            color: #2b5f88;
            text-decoration: none;
        }

        .footer-links.disabled a {
            color: #7f8d98;
            cursor: default;
        }
    </style>
    <script type="text/javascript">
        var dialogSettings = {};
        var uiDisabled = false;

        function element(id) {
            return document.getElementById(id);
        }

        function callRuby(action, payload) {
            if (uiDisabled && action !== 'read_settings') {
                return;
            }

            if (window.sketchup && typeof window.sketchup[action] === 'function') {
                if (typeof payload === 'undefined') {
                    window.sketchup[action]();
                } else {
                    window.sketchup[action](payload);
                }
                return;
            }

            var url = 'skp:' + action + '@';
            if (typeof payload !== 'undefined') {
                url += payload;
            }
            window.location = url;
        }

        function collectSettings() {
            return dialogSettings || {};
        }

        function applySettings(settings) {
            dialogSettings = settings || {};
        }

        function setStatus(text, busy) {
            var status = element('status');
            status.className = busy ? 'busy' : '';
            status.innerHTML = text || 'Ready.';
        }

        function setUiDisabled(disabled) {
            uiDisabled = !!disabled;
            element('footer-links').className = disabled ? 'row footer-links disabled' : 'row footer-links';
            var nodes = document.getElementsByTagName('*');
            var i;
            for (i = 0; i < nodes.length; i += 1) {
                if (nodes[i].tagName === 'INPUT' || nodes[i].tagName === 'TEXTAREA' || nodes[i].tagName === 'SELECT' || nodes[i].tagName === 'BUTTON') {
                    nodes[i].disabled = !!disabled;
                }
            }
        }

        function clearTranscript() {
            element('transcript').innerHTML = '';
        }

        function appendEntry(className, title, body, meta) {
            var wrapper = document.createElement('div');
            wrapper.className = 'entry ' + className;

            var heading = document.createElement('h3');
            heading.appendChild(document.createTextNode(title));
            wrapper.appendChild(heading);

            var pre = document.createElement('pre');
            pre.appendChild(document.createTextNode(body || ''));
            wrapper.appendChild(pre);

            if (meta) {
                var metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                metaDiv.appendChild(document.createTextNode(meta));
                wrapper.appendChild(metaDiv);
            }

            element('transcript').appendChild(wrapper);
            element('transcript').scrollTop = element('transcript').scrollHeight;
        }

        function appendPrompt(text) {
            appendEntry('prompt-entry', 'Prompt', text, 'Scene context is gathered on the Ruby side and sent to the local proxy.');
        }

        function appendResponse(code, info, rubyOutput) {
            appendEntry('response-entry', 'Generated Ruby', code, info || '');
            if (rubyOutput) {
                appendEntry('response-entry', 'Ruby Output', rubyOutput, '');
            }
        }

        function appendError(message, info) {
            appendEntry('error-entry', 'Error', message, info || '');
        }

        function submitPrompt() {
            var prompt = element('prompt').value.replace(/^\s+|\s+$/g, '');
            if (!prompt) {
                setStatus('Enter a prompt first.', false);
                element('prompt').focus();
                return false;
            }

            var payload = {
                prompt: prompt
            };

            element('prompt').value = '';
            setStatus('Sending request...', true);
            callRuby('submit_prompt', encodeURIComponent(JSON.stringify(payload)));
            return false;
        }

        function closeDialog() {
            callRuby('close_dlg', '');
        }

        function initDialog() {
            setStatus('Loading settings...', true);
            setUiDisabled(true);
            callRuby('read_settings', '');
            element('prompt').focus();
        }
    </script>
</head>
<body onload="initDialog();">
    <div class="row" style="color: #4a5b68;">
        Settings now open in a side panel to the right. Use it to reduce reasoning effort or raise max output tokens for long requests, then return to defaults when needed.
    </div>

    <div class="row">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="6"></textarea>
    </div>

    <div class="buttons">
        <button type="button" onclick="submitPrompt();">Send</button>
        <button type="button" class="secondary" onclick="callRuby('focus_settings_dlg', '');">Settings</button>
        <button type="button" class="secondary" onclick="callRuby('clear_dlg', '');">Clear</button>
        <button type="button" class="secondary" onclick="closeDialog();">Close</button>
    </div>

    <div id="status">Ready.</div>
    <div id="transcript"></div>

    <div class="row footer-links" id="footer-links" style="margin-top: 10px;">
        <a href="javascript:callRuby('disclaimer_dlg', '');">Terms</a>
    </div>
</body>
</html>
